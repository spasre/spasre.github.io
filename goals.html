---
layout: null
permalink: /goals/
---
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
{% include head-common.html %}
  <meta name="description" content="长期目标：把一条长期计划拆成知识点图，按拓扑序排成每天的任务。">
  <title>目标 — {{ site.title | escape }}</title>
</head>
<body data-tasks-url="{{ '/goals/' | relative_url }}">
  <canvas id="petals" aria-hidden="true"></canvas>
  <div class="page">
{% include header.html %}
    <main id="top">
      <section class="home-intro tasks-intro" aria-labelledby="goals-page-title">
        <h1 id="goals-page-title">长期目标</h1>
        <p>写下一条想长期投入的目标，助手会把它拆成一张知识点图。节点按拓扑序排：前置没做完，后面的节点点不亮。每个节点会变成一条带日期的任务，任务板上勾掉一条，图上的节点就跟着亮；点节点也能直接标记完成。</p>
      </section>

      <section class="section" id="goal-board" aria-label="长期目标">
        <form class="task-form goal-form" id="goal-form" autocomplete="off">
          <label class="task-field task-field-wide">
            <span>目标</span>
            <input class="task-input" type="text" name="title" placeholder="例如：学习 LLVM 优化" required>
          </label>
          <label class="task-field task-field-wide">
            <span>补充说明（可选）</span>
            <input class="task-input" type="text" name="detail" placeholder="例如：主要是编译器后端优化，能看懂 pass 就行">
          </label>
          <label class="task-field">
            <span>分类</span>
            <input class="task-input" type="text" name="category" list="goal-category-options" placeholder="分类">
          </label>
          <label class="task-field">
            <span>开始日期</span>
            <input class="task-input" type="date" name="startDate">
          </label>
          <label class="task-field">
            <span>每天排几个知识点</span>
            <select class="task-select" name="pace">
              <option value="1" selected>1 个</option>
              <option value="2">2 个</option>
              <option value="3">3 个</option>
              <option value="4">4 个</option>
            </select>
          </label>
          <div class="task-actions-cell">
            <button class="task-submit" type="submit">添加目标</button>
            <button class="task-cancel" type="button" id="goal-cancel" hidden>取消</button>
          </div>
        </form>
        <datalist id="goal-category-options"></datalist>

        <p class="task-hint" id="goal-agent-hint"></p>
        <p class="task-agent-status" id="goal-status" role="status"></p>
        <p class="task-hint" id="goal-summary"></p>
        <div id="goal-list"></div>
      </section>
    </main>
{% include footer.html %}
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/tasks.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/goals.js' | relative_url }}"></script>
</body>
</html>
