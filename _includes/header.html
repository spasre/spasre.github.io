<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}，返回首页">
    <span class="mark" aria-hidden="true">s</span>
    <span>{{ site.title | escape }}</span>
  </a>
  <div class="header-tools">
    <nav class="nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/' | relative_url }}#categories">分类</a>
      <a href="{{ '/' | relative_url }}#about">关于</a>
    </nav>
    <div class="header-actions">
      <form class="search-form" role="search">
        <svg class="search-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/>
          <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input class="search-input" type="search" name="q" placeholder="搜索…" aria-label="搜索博客" aria-controls="search-results" aria-expanded="false">
      </form>
      <div class="search-results" id="search-results" role="region" aria-label="搜索结果" aria-live="polite" hidden></div>
      <button class="theme-toggle" type="button" aria-label="切换夜间模式" aria-pressed="false" title="切换夜间模式">
        <svg class="moon-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20.1 15.2A8.5 8.5 0 0 1 8.8 3.9 8.6 8.6 0 1 0 20.1 15.2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m17.5 4 .5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5Z" fill="currentColor"/>
        </svg>
        <svg class="sun-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" hidden>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>
<script type="application/json" id="post-search-data">[{% for post in site.posts %}{"title":{{ post.title | jsonify }},"detail":{{ post.content | strip_html | normalize_whitespace | jsonify }},"href":{{ post.url | relative_url | jsonify }},"type":"文章"}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
